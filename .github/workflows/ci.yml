name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Типы, линт и юнит-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Линт
        run: npm run lint

      - name: Юнит- и компонентные тесты
        run: npm run test:coverage

      - name: Отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Production-сборка
        run: npm run build

      - name: Установка браузера
        run: npx playwright install --with-deps chromium

      - name: E2E-тесты
        run: npm run e2e

      - name: Отчёт Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker-образ
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: integrator-7-1:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-проверка контейнера
        run: |
          docker run -d --name integrator -p 3000:3000 integrator-7-1:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/objects > /dev/null; then
              echo "Приложение отвечает"
              docker rm -f integrator
              exit 0
            fi
            sleep 2
          done
          echo "Контейнер не поднялся"
          docker logs integrator
          exit 1
